<!doctype html>
<html lang="en" class="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#111111">
<link rel="stylesheet" href="/styles.css">
<link rel="stylesheet" href="/shell.css">
<style>body{margin:0}.harness{width:1000px;height:860px;display:flex;flex-direction:column}.harness .ulune-wheel-zoom{flex:1 1 auto;min-height:0}.harness .ulune-wheel-zoom-port{flex:1 1 auto;min-height:0;height:auto}</style>
<script>(function(){try{var t=localStorage.getItem("ulune.theme");if(t!=="light"&&t!=="dark")t="dark";var r=document.documentElement;r.classList.remove("light","dark");r.classList.add(t);r.style.colorScheme=t}catch(e){document.documentElement.classList.add("dark")}})();</script>
</head>
<body><div id="root"></div><script type="module" src="/app.js"></script></body>
</html>
