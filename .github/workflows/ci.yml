# Checks on every push to main and every pull request: types, lint, the unit
# and precision tests, the build and a run of the built server (the deploy
# check). The end-to-end suites run nightly and on demand: they drive a
# browser through the whole site for about twenty minutes.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Types, lint, tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - name: Unit and precision tests
        run: npm run test:unit
      - run: npm run build
      # The deploy check casts a chart through the page in Chromium.
      - run: npx playwright install --with-deps chromium
      - name: The built server, as Vercel runs it
        run: npm run check:deploy

  e2e:
    name: End-to-end suites
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Start the site
        run: |
          nohup npm run dev > vite.log 2>&1 &
          for i in $(seq 1 90); do
            curl -sf -o /dev/null http://127.0.0.1:8097/ && exit 0
            sleep 2
          done
          cat vite.log
          exit 1
      - name: End-to-end suites
        run: npm run test:e2e
      - name: Screens of a failed run
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-screens
          path: |
            screenshots/e2e
            vite.log
          retention-days: 7
