name: Something doesn't work
description: A page, a button or a mode that fails or behaves oddly.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        **Issues are public.** Don't post anyone's birth date, time or place, a chart's name, or a screenshot showing them. The sample chart (1 January 2000, noon, Greenwich) or an invented birth is enough.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what you saw instead.
    validations:
      required: true
  - type: input
    id: where
    attributes:
      label: Where
      description: The page or mode, and Ulune's version (at the bottom of Settings).
      placeholder: Transits, Ulune 1.0
  - type: input
    id: device
    attributes:
      label: Device and browser
      placeholder: iPhone 15, Safari 27
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: This issue contains no real person's birth details.
          required: true
